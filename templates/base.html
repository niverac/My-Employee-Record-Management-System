<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EMS{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="{{ url_for('dashboard') }}">
        <span class="brand-icon">●</span><span>EMS</span>
      </a>
      <nav class="nav-menu">
        <a class="nav-link {% if active_page == 'employees' %}active{% endif %}" href="{{ url_for('employees') }}"><span class="nav-icon">♟</span> Employees</a>
        <a class="nav-link {% if active_page == 'departments' %}active{% endif %}" href="{{ url_for('departments') }}"><span class="nav-icon">▤</span> Departments</a>
        <a class="nav-link {% if active_page == 'vacations' %}active{% endif %}" href="{{ url_for('vacations') }}"><span class="nav-icon">✈</span> Vacations</a>
        <a class="nav-link {% if active_page == 'users' %}active{% endif %}" href="{{ url_for('users') }}"><span class="nav-icon">♟</span> Users</a>
      </nav>
      <div class="sidebar-bottom"><a href="{{ url_for('login') }}">↪ Sign out</a></div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">☰</button>
        <div class="topbar-right"><span class="avatar-small">U</span><span>Admin</span></div>
      </header>
      <section class="page-content">
        {% block content %}{% endblock %}
      </section>
    </main>
  </div>
  {% endblock %}
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
